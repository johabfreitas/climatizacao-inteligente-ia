name: Sync to Hugging Face
on:
  push:
    branches: [main, master] # Ativa a cópia quando você der push na branch main ou master

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://johabfreitas:$HF_TOKEN@huggingface.co/spaces/johabfreitas/climatizacao-inteligente-ia main
